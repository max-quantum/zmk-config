CONFIG_ZMK_KEYBOARD_NAME="QuantumSplit"

# Settings specific for left shield
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- TEMP bond-persistence diagnostics (REVERT after); needs zmk-usb-logging snippet ---
# Quiet the global BT flood (HCI/conn spam); deep-log only the bond store/load path.
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y
CONFIG_BT_SETTINGS_LOG_LEVEL_DBG=y
CONFIG_SETTINGS_LOG_LEVEL_DBG=y
CONFIG_NVS_LOG_LEVEL_DBG=y
# Buffer early-boot logs until USB CDC enumerates, and absorb bursts.
CONFIG_LOG_BUFFER_SIZE=8192
