# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Common (both halves)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_KEYBOARD_NAME=QuantumSplit

CONFIG_ZMK_BLE=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=20000

# Settings specific for left shield
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
