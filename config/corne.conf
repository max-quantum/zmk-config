# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Link drops by supervision timeout right after the host upgrades to the LE 2M PHY
# (btmon: Encryption OK -> PHY Update -> LE 2M -> silence -> Disconnect 0x08).
# 2M has ~6 dB less link budget; on this dual-role single-radio keyboard it's marginal.
# Force the connection to stay on the robust 1M PHY.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_AUTO_PHY_UPDATE=n

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=20000
