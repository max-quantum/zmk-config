# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# Persist BLE bonds across cold boot. CONFIG_SETTINGS alone selects the NONE
# backend (saves become no-ops); a flash backend (NVS) must be enabled explicitly.
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=20000
